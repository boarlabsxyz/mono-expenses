# SonarQube project configuration for mono-expenses

sonar.projectKey=boarlabsxyz_mono-expenses
sonar.organization=boarlabsxyz
sonar.projectName=mono-expenses
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*_test.go

# Language and exclusions
sonar.language=go
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.go.coverage.reportPaths=unit.out

# Exclude generated files, vendor, and scripts from analysis
sonar.exclusions=vendor/**,bin/**,scripts/**
sonar.test.exclusions=**/scripts/**

# Go specific settings
sonar.go.tests.reportPaths=test-report.json

# Coverage verification settings
coverage.threshold=80
coverage.exclusions=**/main.go,**/*_generated.go,**/mock_*.go,**/testdata/**,**/scripts/**
coverage.unitReportPath=coverage/unit.out
coverage.e2eReportPath=coverage/e2e.out
